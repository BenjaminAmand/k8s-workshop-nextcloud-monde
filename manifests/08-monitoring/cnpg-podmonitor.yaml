apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-monitor
  namespace: nextcloud
  labels:
    # Ensure this matches the label selector your Prometheus operator looks for
    release: kube-prometheus-stack 
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres 
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    path: /metrics