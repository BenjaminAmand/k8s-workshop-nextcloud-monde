# Helm values override for kube-prometheus-stack.
# Rename to values.yaml when complete.

# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  # Set a known admin password for the demo. 
  adminPassword: "admin-workshop-pass"

  ingress:
    # Expose Grafana via an Ingress resource
    enabled: true

    # Match the IngressClass used by the rest of your workshop (usually nginx)
    ingressClassName: "traefik"

    annotations:
      cert-manager.io/cluster-issuer: "selfsigned-cluster-issuer"

    hosts:
      - grafana.local

    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.local

  persistence:
    # Ensure custom dashboards and settings survive pod restarts
    enabled: true
    size: 2Gi

# ── Prometheus ─────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # {} widens the selector to watch all namespaces, allowing Prometheus
    # to discover CloudNativePG metrics in the 'nextcloud' namespace.
    podMonitorNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 5Gi is plenty for a workshop environment with a 10-day retention period
              storage: 5Gi

# ── Alertmanager ───────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi